<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>婚禮外包商總覽</title>
  <link rel="stylesheet" href="style.css" />
  <script src="vendors.js"></script>
  <script src="https://accounts.google.com/gsi/client" async></script>
</head>
<body>

<nav id="main-nav">
  <a class="nav-brand" href="index.html">季浤 ♡ 柔瑄</a>
  <a href="index.html" class="active">總覽</a>
  <div class="nav-auth">
    <div id="g-btn-wrapper"></div>
    <div id="nav-user" style="display:none;">
      <img id="nav-avatar" class="nav-avatar" src="" alt="" />
      <span id="nav-name"></span>
      <button class="nav-signout" onclick="authSignOut()">登出</button>
    </div>
  </div>
</nav>

<div class="page-header">
  <h1>婚禮外包商總覽</h1>
  <p class="subtitle">季浤 ♡ 柔瑄 &nbsp;｜&nbsp; 2026 年 12 月 06 日（六）</p>
</div>

<div class="container-wide">

  <!-- 費用摘要 -->
  <div class="summary-bar">
    <div class="summary-card">
      <div class="s-label">外包商數量</div>
      <div class="s-value">5 家</div>
    </div>
    <div class="summary-card">
      <div class="s-label">婚禮日期</div>
      <div class="s-value">2026/12/06</div>
    </div>
    <div class="summary-card">
      <div class="s-label">費用總計（估）</div>
      <div class="s-value">≈ NT$200,459</div>
    </div>
    <div class="summary-card">
      <div class="s-label">已付金額（估）</div>
      <div class="s-value">≈ NT$78,070</div>
    </div>
    <div class="summary-card">
      <div class="s-label">待付金額（估）</div>
      <div class="s-value">≈ NT$122,389</div>
    </div>
  </div>

  <!-- 廠商卡片（由 vendors.js 動態渲染） -->
  <div class="vendor-grid" id="vendor-grid"></div>

  <!-- 婚禮時間軸 -->
  <div class="card" style="margin-top:36px;" id="timeline-section">
    <div class="card-header" style="justify-content:space-between;flex-wrap:wrap;gap:8px;">
      <div style="display:flex;align-items:center;gap:10px;">
        <span>🗓️</span>
        <h2>婚禮時間軸</h2>
      </div>
      <div class="tl-add-btns" style="display:none;">
        <button class="tl-add-btn" onclick="timelineAddVendor()">＋ 外包商事項</button>
        <button class="tl-add-btn tl-add-btn-todo" onclick="timelineAddTodo()">＋ 待辦事項</button>
      </div>
      <span id="tl-login-hint" style="font-size:.78rem;color:var(--muted);letter-spacing:.3px;">🔒 請登入後才能編輯</span>
      <span id="sync-status" style="font-size:.72rem;letter-spacing:.5px;color:var(--muted);"></span>
    </div>
    <div class="card-body">
      <div id="timeline-container"></div>
    </div>
  </div>

</div>

<footer>整理日期：2026 年 4 月 14 日 &nbsp;｜&nbsp; 以合約原件為準，本文件僅供參考</footer>

<script>
(function () {
  'use strict';

  // ── Nav ──
  function buildNav() {
    var nav = document.getElementById('main-nav');
    var authHtml = nav.querySelector('.nav-auth').outerHTML;
    nav.innerHTML =
      '<a class="nav-brand" href="index.html">季浤 ♡ 柔瑄</a>' +
      '<a href="index.html" class="active">總覽</a>' +
      VENDOR_ORDER.map(function (id) {
        return '<a href="vendor.html?v=' + id + '">' + VENDORS[id].name + '</a>';
      }).join('') +
      authHtml;
  }

  // ── 廠商卡片 ──
  function buildVendorGrid() {
    var STATUS_CLS = { paid: 'badge-paid', partial: 'badge-partial', pending: 'badge-pending', note: 'badge-note' };
    var html = VENDOR_ORDER.map(function (id) {
      var v = VENDORS[id];
      var badgeCls = STATUS_CLS[v.paymentStatus] || 'badge-partial';
      return '<a class="vendor-tile" href="vendor.html?v=' + id + '">' +
        '<span class="tile-arrow">→</span>' +
        '<div class="tile-icon" style="background:' + v.iconBg + ';">' + v.icon + '</div>' +
        '<div class="tag ' + v.tagCls + '">' + v.category + '</div>' +
        '<h3>' + v.name + '</h3>' +
        '<div class="tile-cat">' + v.subtitle + '</div>' +
        '<span class="badge ' + badgeCls + '">' + v.paymentBadge + '</span>' +
        '<div class="tile-amount" style="margin-top:12px;">' + v.totalAmount + '</div>' +
        '<div class="tile-note">' + v.tileNote + '</div>' +
        '</a>';
    }).join('');
    document.getElementById('vendor-grid').innerHTML = html;
  }

  var STORAGE_KEY = 'wedding_timeline_v1';
  var GOOGLE_CLIENT_ID = '687764654535-471hglnm2rse8f4jmedsut471bt2r0nq.apps.googleusercontent.com';

  var VENDOR_MAP = {
    sosi:    { label: 'SOSI FOTO',      cls: 'tag-photo'   },
    inkajan: { label: '印卡讚',          cls: 'tag-instant' },
    mongen:  { label: '蒙恩聽障烘焙坊', cls: 'tag-cake'    },
    mryes:   { label: 'Mr. Yes',         cls: 'tag-video'   },
    beauty:  { label: '婚前保養',        cls: 'tag-beauty'  },
  };

  var STATUS_MAP = {
    paid:    { label: '已付',     cls: 'badge-paid'    },
    partial: { label: '部分已付', cls: 'badge-partial' },
    pending: { label: '待付',     cls: 'badge-pending' },
    note:    { label: '備註',     cls: 'badge-note'    },
  };

  var DEFAULT_EVENTS = [
    { id: 1,  type: 'vendor', vendor: 'sosi',    date: '2025/04/11', title: 'SOSI FOTO　合約簽訂・訂金',           amount: 'NT$53,000',    status: 'paid'    },
    { id: 2,  type: 'vendor', vendor: 'mryes',   date: '2025/04/12', title: 'YES先生　婚禮錄影・訂金',             amount: 'NT$3,000',     status: 'paid'    },
    { id: 3,  type: 'vendor', vendor: 'inkajan', date: '2025/06/10', title: '印卡讚　合約簽訂・定金',              amount: 'NT$5,070',     status: 'paid'    },
    { id: 4,  type: 'vendor', vendor: 'mongen',  date: '2026/01/24', title: '蒙恩聽障烘焙坊　喜餅訂購',           amount: '依盒數計',     status: 'partial' },
    { id: 5,  type: 'vendor', vendor: 'beauty',  date: '2026/04/13', title: '婚前保養　護膚療程合約簽訂',          amount: '約 NT$40,609', status: 'partial' },
    { id: 6,  type: 'vendor', vendor: 'mryes',   date: '2026/04/16', title: 'YES先生　婚禮錄影・第二期款',         amount: 'NT$17,000',    status: 'paid'    },
    { id: 7,  type: 'vendor', vendor: 'mongen',  date: '2026/09/17', title: '蒙恩聽障烘焙坊　喜餅取貨（須結清）', amount: '—',            status: 'pending' },
    { id: 8,  type: 'vendor', vendor: 'mryes',   date: '2026/12/06', title: 'YES先生　婚禮錄影・尾款',            amount: 'NT$38,000',    status: 'pending' },
    { id: 9,  type: 'vendor', vendor: 'inkajan', date: '2026/12/06', title: '印卡讚　尾款（簽到日付清）',          amount: 'NT$28,800',    status: 'pending' },
    { id: 10, type: 'vendor', vendor: 'sosi',    date: '2026/12/06', title: 'SOSI FOTO　婚禮攝影尾款',            amount: 'NT$6,600',     status: 'pending' },
  ];

  var pendingNew = null;
  var currentUser = null; // { email, name, picture, token }

  var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxHaRKuoe1wRKKYTF-LwadJBg3wIM1h0mZ3smAMsU3VuepApKTxG3rJUP5U1eu8fMTMGQ/exec';

  // ── Google 登入 ──
  function parseJwtPayload(token) {
    var b64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    return JSON.parse(decodeURIComponent(
      atob(b64).split('').map(function (c) {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join('')
    ));
  }

  function authInit() {
    if (!window.google || GOOGLE_CLIENT_ID.indexOf('YOUR_CLIENT_ID') === 0) return;
    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: handleCredentialResponse,
      auto_select: true,
    });
    var wrapper = document.getElementById('g-btn-wrapper');
    if (wrapper) {
      google.accounts.id.renderButton(wrapper, {
        theme: 'filled_white', size: 'small', text: 'signin_with',
        shape: 'pill', locale: 'zh-TW',
      });
    }
    google.accounts.id.prompt();
  }

  function handleCredentialResponse(response) {
    try {
      var payload = parseJwtPayload(response.credential);
      currentUser = { email: payload.email, name: payload.name, picture: payload.picture, token: response.credential };
    } catch (e) { return; }
    updateAuthUI();
    renderTimeline();
  }

  function updateAuthUI() {
    var btnWrapper = document.getElementById('g-btn-wrapper');
    var userDiv = document.getElementById('nav-user');
    if (currentUser) {
      if (btnWrapper) btnWrapper.style.display = 'none';
      if (userDiv) {
        userDiv.style.display = 'flex';
        var avatarEl = document.getElementById('nav-avatar');
        var nameEl = document.getElementById('nav-name');
        if (avatarEl) { avatarEl.src = currentUser.picture || ''; avatarEl.style.display = currentUser.picture ? '' : 'none'; }
        if (nameEl) nameEl.textContent = currentUser.name || currentUser.email;
      }
    } else {
      if (btnWrapper) btnWrapper.style.display = '';
      if (userDiv) userDiv.style.display = 'none';
    }
    var addBtns = document.querySelector('.tl-add-btns');
    var loginHint = document.getElementById('tl-login-hint');
    if (addBtns) addBtns.style.display = currentUser ? '' : 'none';
    if (loginHint) loginHint.style.display = currentUser ? 'none' : '';
  }

  window.authSignOut = function () {
    if (window.google) google.accounts.id.disableAutoSelect();
    currentUser = null;
    updateAuthUI();
    renderTimeline();
  };

  window.onGoogleLibraryLoad = authInit;

  function todayStr() { return new Date().toISOString().slice(0, 10).replace(/-/g, '/'); }
  function dateToInput(d) { return String(d || '').slice(0, 10).replace(/\//g, '-'); }
  function fmtDate(d) { return String(d || '').slice(0, 10); }

  function migrateEvent(ev) {
    return Object.assign({ type: 'vendor', vendor: '', todos: [], amount: '', status: 'note' }, ev, {
      date: String(ev.date || '').slice(0, 10).replace(/-/g, '/')
    });
  }

  function jsonp(url, cb) {
    var name = '_wt' + Date.now() + Math.floor(Math.random() * 10000);
    var s = document.createElement('script');
    s.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + name;
    window[name] = function (data) {
      try { document.head.removeChild(s); } catch (e) {}
      delete window[name];
      cb(null, data);
    };
    s.onerror = function () {
      try { document.head.removeChild(s); } catch (e) {}
      delete window[name];
      cb(new Error('network'), null);
    };
    document.head.appendChild(s);
  }

  function setSyncStatus(msg, isErr) {
    var el = document.getElementById('sync-status');
    if (!el) return;
    el.textContent = msg;
    el.style.color = isErr ? 'var(--red)' : 'var(--muted)';
  }

  function loadFromSheets(cb) {
    setSyncStatus('載入中…');
    jsonp(SCRIPT_URL + '?action=read', function (err, data) {
      if (err || !data || !data.ok) { setSyncStatus('讀取失敗 ⚠', true); cb(null); }
      else { setSyncStatus(''); cb(data.events); }
    });
  }

  function syncToSheets(events) {
    if (!currentUser) { setSyncStatus('請先登入才能同步 ⚠', true); return; }
    setSyncStatus('同步中…');
    var encoded = encodeURIComponent(JSON.stringify(events));
    var token = encodeURIComponent(currentUser.token);
    jsonp(SCRIPT_URL + '?action=write&data=' + encoded + '&token=' + token, function (err, data) {
      if (err || !data || !data.ok) {
        setSyncStatus((data && data.error) || '同步失敗 ⚠', true);
      } else {
        setSyncStatus('已同步 ✓');
        setTimeout(function () { setSyncStatus(''); }, 2500);
      }
    });
  }

  function loadEvents() {
    try { var r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : null; }
    catch (e) { return null; }
  }

  function saveEvents(events) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
    syncToSheets(events);
  }

  function getEvents() {
    var raw = loadEvents();
    var events = raw || JSON.parse(JSON.stringify(DEFAULT_EVENTS));
    return events.map(migrateEvent);
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function renderTodos(ev) {
    var canEdit = !!currentUser;
    var items = (ev.todos || []).map(function (t) {
      return (
        '<div class="tl-todo-item" data-tid="' + t.id + '">' +
          '<input type="checkbox" class="tl-todo-cb"' + (t.done ? ' checked' : '') +
            (canEdit ? ' onchange="todoToggle(this)"' : ' disabled') + '>' +
          '<span class="tl-todo-text' + (t.done ? ' tl-done' : '') + '"' +
            (canEdit ? ' ondblclick="todoStartEdit(this,event)"' : '') + '>' + esc(t.text) + '</span>' +
          (canEdit ? '<button class="tl-todo-del" onclick="todoDelete(this)" title="刪除">✕</button>' : '') +
        '</div>'
      );
    }).join('');
    var addRow = canEdit
      ? '<div class="tl-todo-add-row">' +
          '<button class="tl-todo-add-btn" onclick="todoShowInput(this)">＋ 新增細節</button>' +
          '<div class="tl-todo-add-form" style="display:none;">' +
            '<input class="tl-todo-inp" placeholder="輸入細節，按 Enter 儲存" onkeydown="todoInputKey(event,this)">' +
            '<button class="tl-todo-add-confirm" onclick="todoConfirmAdd(this)">✓</button>' +
          '</div>' +
        '</div>'
      : '';
    return '<div class="tl-todos">' + items + addRow + '</div>';
  }

  function renderItem(ev, editMode) {
    var canEdit = !!currentUser;
    var today = todayStr();
    var isPast = ev.date < today;
    var isToday = ev.date === today;
    var isVendor = ev.type !== 'todo';
    var s = STATUS_MAP[ev.status] || STATUS_MAP.note;
    var dotCls = isVendor ? 'tl-dot-' + (ev.status || 'note') : 'tl-dot-todo';
    var cardCls = 'tl-card ' + (isVendor ? 'tl-card-' + (ev.status || 'note') : 'tl-card-todo');
    var dateCls = 'tl-date-label' + (isPast ? ' tl-past' : '');
    var todayTag = isToday ? '<span class="tl-today-tag">今日</span>' : '';

    var typeTag = '';
    if (isVendor && ev.vendor && VENDOR_MAP[ev.vendor]) {
      var vm = VENDOR_MAP[ev.vendor];
      typeTag = '<span class="tag ' + vm.cls + ' tl-type-tag">' + vm.label + '</span>';
    } else if (!isVendor) {
      typeTag = '<span class="tl-todo-type-tag">待辦</span>';
    }

    var badgeHtml = isVendor
      ? '<span class="badge ' + s.cls + (ev.amount && canEdit ? ' tl-badge-clickable' : '') + '"' +
          (ev.amount && canEdit ? ' onclick="timelineCycleStatus(this)" title="點擊切換狀態"' : '') + '>' +
          s.label + (ev.amount && canEdit ? ' ↻' : '') + '</span>'
      : '';

    var viewStyle = editMode ? ' style="display:none;"' : '';
    var editStyle = editMode ? '' : ' style="display:none;"';

    var vendorOpts = '<option value="">（請選擇外包商）</option>' +
      Object.keys(VENDOR_MAP).map(function (k) {
        return '<option value="' + k + '"' + (ev.vendor === k ? ' selected' : '') + '>' + VENDOR_MAP[k].label + '</option>';
      }).join('');

    var statusOpts = Object.keys(STATUS_MAP).map(function (k) {
      return '<option value="' + k + '"' + (ev.status === k ? ' selected' : '') + '>' + STATUS_MAP[k].label + '</option>';
    }).join('');

    var editFormRows = isVendor
      ? '<label>外包商</label><select class="tl-inp" data-field="vendor">' + vendorOpts + '</select>' +
        '<label>日期</label><input type="date" class="tl-inp" data-field="date" value="' + esc(dateToInput(ev.date)) + '" />' +
        '<label>事項</label><input type="text" class="tl-inp" data-field="title" value="' + esc(ev.title) + '" placeholder="事項說明（必填）" />' +
        '<label>金額</label><input type="text" class="tl-inp" data-field="amount" value="' + esc(ev.amount || '') + '" placeholder="NT$0（可留空）" />' +
        '<label>狀態</label><select class="tl-inp" data-field="status">' + statusOpts + '</select>'
      : '<label>日期</label><input type="date" class="tl-inp" data-field="date" value="' + esc(dateToInput(ev.date)) + '" />' +
        '<label>主旨</label><input type="text" class="tl-inp" data-field="title" value="' + esc(ev.title) + '" placeholder="代辦事項主旨（必填）" />';

    return (
      '<div class="tl-item' + (isPast ? ' tl-item-past' : '') + '" data-id="' + esc(String(ev.id)) + '" data-type="' + esc(ev.type || 'vendor') + '">' +
        '<div class="tl-left">' +
          '<div class="tl-dot ' + dotCls + '"></div>' +
          '<div class="tl-line"></div>' +
        '</div>' +
        '<div class="tl-right">' +
          '<div class="' + dateCls + '">' + fmtDate(ev.date) + todayTag + '</div>' +
          '<div class="' + cardCls + '">' +
            '<div class="tl-view"' + viewStyle + '>' +
              (typeTag ? '<div class="tl-type-tag-row">' + typeTag + '</div>' : '') +
              '<div class="tl-title-row">' +
                '<span class="tl-title-text">' + esc(ev.title) + '</span>' +
                (canEdit
                  ? '<div class="tl-btns">' +
                      '<button class="tl-btn-icon" onclick="timelineEdit(this)" title="編輯">✏️</button>' +
                      '<button class="tl-btn-icon" onclick="timelineDelete(this)" title="刪除">🗑️</button>' +
                    '</div>'
                  : '') +
              '</div>' +
              (isVendor && ev.amount ? '<div class="tl-amount-text">' + esc(ev.amount) + '</div>' : '') +
              badgeHtml +
              renderTodos(ev) +
            '</div>' +
            '<div class="tl-edit"' + editStyle + '>' +
              '<div class="tl-edit-grid">' + editFormRows + '</div>' +
              '<div class="tl-edit-actions">' +
                '<button class="tl-btn-save" onclick="timelineSave(this)">儲存</button>' +
                '<button class="tl-btn-cancel" onclick="timelineCancelEdit(this)">取消</button>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  function renderTimeline() {
    var container = document.getElementById('timeline-container');
    if (!container) return;
    var events = getEvents().sort(function (a, b) { return a.date.localeCompare(b.date); });
    var all = events.concat(pendingNew ? [pendingNew] : []);
    if (all.length === 0) {
      container.innerHTML = '<p style="color:var(--muted);text-align:center;padding:24px 0;">尚無事項，點擊上方按鈕新增</p>';
      return;
    }
    container.innerHTML = all.map(function (ev) { return renderItem(ev, ev.id === '__new__'); }).join('');
  }

  window.timelineEdit = function (btn) {
    var item = btn.closest('.tl-item');
    item.querySelector('.tl-view').style.display = 'none';
    item.querySelector('.tl-edit').style.display = 'block';
  };

  window.timelineCancelEdit = function (btn) {
    var item = btn.closest('.tl-item');
    if (item.dataset.id === '__new__') { pendingNew = null; renderTimeline(); return; }
    item.querySelector('.tl-view').style.display = '';
    item.querySelector('.tl-edit').style.display = 'none';
  };

  window.timelineSave = function (btn) {
    var item = btn.closest('.tl-item');
    var id = item.dataset.id;
    var type = item.dataset.type || 'vendor';
    var fields = {};
    item.querySelectorAll('.tl-inp').forEach(function (inp) {
      if (inp.dataset.field) fields[inp.dataset.field] = inp.value.trim();
    });

    if (!fields.date || !fields.title) {
      alert('請填寫日期和' + (type === 'todo' ? '主旨' : '事項名稱'));
      return;
    }
    if (type === 'vendor' && !fields.vendor) { alert('請選擇外包商'); return; }

    fields.date = fields.date.replace(/-/g, '/');

    var events = getEvents();
    if (id === '__new__') {
      events.push({
        id: Date.now(),
        type: type,
        vendor: type === 'vendor' ? (fields.vendor || '') : '',
        date: fields.date,
        title: fields.title,
        amount: type === 'vendor' ? (fields.amount || '') : '',
        status: type === 'vendor' ? (fields.status || 'note') : 'note',
        todos: [],
      });
      pendingNew = null;
    } else {
      var numId = Number(id);
      for (var i = 0; i < events.length; i++) {
        if (events[i].id === numId) {
          events[i] = Object.assign({}, events[i], {
            vendor: type === 'vendor' ? (fields.vendor || '') : '',
            date: fields.date,
            title: fields.title,
            amount: type === 'vendor' ? (fields.amount || '') : '',
            status: type === 'vendor' ? (fields.status || events[i].status) : 'note',
          });
          break;
        }
      }
    }
    saveEvents(events);
    renderTimeline();
  };

  window.timelineDelete = function (btn) {
    if (!confirm('確定要刪除這個事項？')) return;
    var item = btn.closest('.tl-item');
    var numId = Number(item.dataset.id);
    saveEvents(getEvents().filter(function (e) { return e.id !== numId; }));
    renderTimeline();
  };

  window.timelineAddVendor = function () {
    if (pendingNew) return;
    pendingNew = { id: '__new__', type: 'vendor', vendor: '', date: todayStr(), title: '', amount: '', status: 'note', todos: [] };
    renderTimeline();
    setTimeout(function () {
      var item = document.querySelector('.tl-item[data-id="__new__"]');
      if (item) {
        item.scrollIntoView({ behavior: 'smooth', block: 'center' });
        var first = item.querySelector('.tl-inp');
        if (first) first.focus();
      }
    }, 50);
  };

  window.timelineAddTodo = function () {
    if (pendingNew) return;
    pendingNew = { id: '__new__', type: 'todo', vendor: '', date: todayStr(), title: '', amount: '', status: 'note', todos: [] };
    renderTimeline();
    setTimeout(function () {
      var item = document.querySelector('.tl-item[data-id="__new__"]');
      if (item) {
        item.scrollIntoView({ behavior: 'smooth', block: 'center' });
        var first = item.querySelector('.tl-inp');
        if (first) first.focus();
      }
    }, 50);
  };

  window.timelineCycleStatus = function (badge) {
    var item = badge.closest('.tl-item');
    var numId = Number(item.dataset.id);
    var events = getEvents();
    var ev = events.find(function (e) { return e.id === numId; });
    if (!ev) return;
    var order = ['paid', 'partial', 'pending', 'note'];
    var idx = order.indexOf(ev.status);
    ev.status = order[(idx + 1) % order.length];
    saveEvents(events);
    renderTimeline();
  };

  window.todoToggle = function (cb) {
    var item = cb.closest('.tl-todo-item');
    var eventId = Number(cb.closest('.tl-item').dataset.id);
    var todoId = Number(item.dataset.tid);
    var events = getEvents();
    var ev = events.find(function (e) { return e.id === eventId; });
    if (ev && ev.todos) {
      var t = ev.todos.find(function (t) { return t.id === todoId; });
      if (t) { t.done = cb.checked; saveEvents(events); }
    }
    var span = item.querySelector('.tl-todo-text');
    cb.checked ? span.classList.add('tl-done') : span.classList.remove('tl-done');
  };

  window.todoDelete = function (btn) {
    var item = btn.closest('.tl-todo-item');
    var eventId = Number(btn.closest('.tl-item').dataset.id);
    var todoId = Number(item.dataset.tid);
    var events = getEvents();
    var ev = events.find(function (e) { return e.id === eventId; });
    if (ev && ev.todos) {
      ev.todos = ev.todos.filter(function (t) { return t.id !== todoId; });
      saveEvents(events);
      item.remove();
    }
  };

  window.todoShowInput = function (btn) {
    var row = btn.closest('.tl-todo-add-row');
    btn.style.display = 'none';
    row.querySelector('.tl-todo-add-form').style.display = 'flex';
    row.querySelector('.tl-todo-inp').focus();
  };

  window.todoInputKey = function (e, inp) {
    if (e.key === 'Enter') { e.preventDefault(); todoConfirmAdd(inp.nextElementSibling); }
    if (e.key === 'Escape') {
      var row = inp.closest('.tl-todo-add-row');
      inp.value = '';
      row.querySelector('.tl-todo-add-form').style.display = 'none';
      row.querySelector('.tl-todo-add-btn').style.display = '';
    }
  };

  window.todoConfirmAdd = function (btn) {
    var form = btn.closest('.tl-todo-add-form');
    var row = form.closest('.tl-todo-add-row');
    var todosDiv = form.closest('.tl-todos');
    var inp = form.querySelector('.tl-todo-inp');
    var text = inp.value.trim();
    if (!text) { inp.focus(); return; }
    var eventId = Number(btn.closest('.tl-item').dataset.id);
    var events = getEvents();
    var ev = events.find(function (e) { return e.id === eventId; });
    if (!ev) return;
    if (!ev.todos) ev.todos = [];
    var newId = Date.now();
    ev.todos.push({ id: newId, text: text, done: false });
    saveEvents(events);
    var newEl = document.createElement('div');
    newEl.className = 'tl-todo-item';
    newEl.dataset.tid = newId;
    newEl.innerHTML = (
      '<input type="checkbox" class="tl-todo-cb" onchange="todoToggle(this)">' +
      '<span class="tl-todo-text" ondblclick="todoStartEdit(this,event)">' + esc(text) + '</span>' +
      '<button class="tl-todo-del" onclick="todoDelete(this)" title="刪除">✕</button>'
    );
    todosDiv.insertBefore(newEl, row);
    inp.value = '';
    form.style.display = 'none';
    row.querySelector('.tl-todo-add-btn').style.display = '';
  };

  window.todoStartEdit = function (span, e) {
    e.preventDefault();
    if (span.querySelector('input')) return;
    var orig = span.textContent;
    span.textContent = '';
    var inp = document.createElement('input');
    inp.className = 'tl-todo-edit-inp';
    inp.value = orig;
    span.appendChild(inp);
    inp.focus();
    inp.select();
    function commit() {
      var val = inp.value.trim() || orig;
      if (val !== orig) {
        var todoId = Number(span.closest('.tl-todo-item').dataset.tid);
        var eventId = Number(span.closest('.tl-item').dataset.id);
        var events = getEvents();
        var ev = events.find(function (e) { return e.id === eventId; });
        if (ev && ev.todos) {
          var t = ev.todos.find(function (t) { return t.id === todoId; });
          if (t) { t.text = val; saveEvents(events); }
        }
      }
      span.textContent = val;
    }
    inp.addEventListener('blur', commit);
    inp.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') { ev.preventDefault(); inp.blur(); }
      if (ev.key === 'Escape') { inp.removeEventListener('blur', commit); span.textContent = orig; }
    });
  };

  document.addEventListener('DOMContentLoaded', function () {
    buildNav();
    buildVendorGrid();
    updateAuthUI(); // 初始狀態：隱藏新增按鈕、顯示登入提示
    if (window.google && window.google.accounts) authInit(); // GSI 已快取時的備用呼叫

    renderTimeline();

    document.getElementById('timeline-container').addEventListener('click', function (e) {
      if (e.target.matches('input[type="date"]')) {
        try { e.target.showPicker(); } catch (ex) {}
      }
    });

    loadFromSheets(function (sheetsEvents) {
      if (sheetsEvents === null || !sheetsEvents.length) return;
      var normalized = sheetsEvents.map(function (ev) {
        return migrateEvent(Object.assign({}, ev, { date: String(ev.date || '').slice(0, 10) }));
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(normalized));
      renderTimeline();
    });
  });
})();
</script>
</body>
</html>
